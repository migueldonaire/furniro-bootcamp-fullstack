# PRODUCTION: the teacher presses the button.
#   Actions -> release -> Run workflow -> version (e.g. 1.0.0)
# It takes what is now on main (the same code that is in staging), creates the
# tag v1.0.0 and the GitHub Release, publishes the image furniro-api:1.0.0
# in Docker Hub and deploys it to production (if the environment asks for approval, it waits).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 1.0.0 (MAJOR.MINOR.PATCH)"
        type: string
        required: true

permissions:
  contents: write # to create the tag and the release

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a valid version. Example: 1.0.0"
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Version $VERSION already exists. To deploy it again use the deploy workflow."
            exit 1
          fi
      - name: Create the tag and the GitHub Release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" --generate-notes

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:${{ inputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:latest

  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ inputs.version }}
      image-tag: ${{ inputs.version }}
      ref: v${{ inputs.version }}
    secrets: inherit
