# Automatic review of each PR with Claude (claude-code-action).
# It is skipped until the variable CLAUDE_REVIEW_ENABLED is "true"
# and the secret CLAUDE_CODE_OAUTH_TOKEN exists (see docs/setup-guide.md, section 6).
# Claude reads CLAUDE.md (root of the repo) to know the rules of the project.
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    if: vars.CLAUDE_REVIEW_ENABLED == 'true' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--max-turns 30 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
