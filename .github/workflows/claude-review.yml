# Automatic review of each PR with Claude (claude-code-action).
# It is skipped until the variable CLAUDE_REVIEW_ENABLED is "true"
# and the secret CLAUDE_CODE_OAUTH_TOKEN exists (see docs/setup-guide.md, section 5).
#
# Claude reads CLAUDE.md and docs/review-guide.md to know the rules of the
# project, and the Jira card of the branch to check its scenarios. It
# leaves comments on the lines of the PR and a summary comment, and gives a
# verdict. If it finds a blocking problem (a bug, a security problem or a
# broken rule of CLAUDE.md), this check goes RED. The ruleset of main requires
# this check ("claude-review"), so a red review stops the merge: it is a gate.
# Fix the problem, push again and Claude reviews the PR again.
name: claude-review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push cancels the old review

jobs:
  claude-review:
    # Skipped (= does not block) in drafts and in Dependabot PRs: Dependabot
    # does not receive the repository secrets, so Claude could not run.
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The card of the branch (feature/FUR-30 -> FUR-30), so that Claude knows
      # the story, the rules and the scenarios. Without the Jira secrets it
      # still works: the file just says that the card could not be read.
      - name: Read the Jira card of the branch
        env:
          BRANCH: ${{ github.head_ref }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: bash .github/scripts/fetch-jira-card.sh "$BRANCH" jira-card.md

      - name: Claude reviews the PR
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Eres el revisor de una PR de alumnos principiantes del bootcamp.
            Revisa como lo haría su profesor: que la tarjeta quede completa y
            bien hecha, y que sepan cuál es su siguiente paso.

            Antes de empezar, lee:
            - CLAUDE.md, sobre todo "Normas del proyecto" y "Revisión de PRs (para Claude)".
            - docs/review-guide.md: cómo tiene que quedar una tarjeta (API, webs, tests, nombres).
            - jira-card.md: la tarjeta de Jira de la rama (historia, reglas y escenarios).
            - La imagen de la pantalla de la tarjeta en docs/screens/ (la tabla del
              apartado 7 de docs/review-guide.md dice cuál es), si la PR toca una web.
            Usa `gh pr view` y `gh pr diff` para leer la PR.

            La tarjeta es la de la rama. Si un commit nombra otro FUR, es una
            subtarea de la misma tarjeta (mira la lista de subtareas en
            jira-card.md): no es otra tarea y no lo comentes.
            Si la PR dice que es solo una parte (por ejemplo, solo la API),
            revisa esa parte y di lo que queda para otra PR, sin bloquear.

            No seas puntilloso. Los apuntes no son la única forma válida: si el
            código funciona y está bien hecho, se acepta. Lo que sí tiene que
            estar: los escenarios de la tarjeta, la validación (class-validator
            en la API, React Hook Form + Zod en la web), la seguridad y los tests.
            No bloquees por cosas pequeñas: ante la duda, no bloquea.

            1. Por cada problema real, deja un comentario en su línea con
               mcp__github_inline_comment__create_inline_comment: en español,
               corto y amable. Di dónde está en los apuntes y da una pista
               concreta (vale "a `quantity` le falta el `@Max(99)`"), pero no
               escribas la funcionalidad.
            2. Al final deja UN comentario de resumen con `gh pr comment`, en este orden:
               - **Lo que está bien**: concreto, no genérico.
               - **La tarjeta, escenario a escenario**: una tabla con cada
                 escenario de jira-card.md, si está hecho y si tiene test.
                 Si no has podido leer la tarjeta, dilo en una línea.
               - **Lo que falta** para cerrar la tarjeta (API, web, validación,
                 estados de carga y error, CSS Modules, mapeo Row → modelo...).
               - **Tests que faltan**: para cada escenario sin test, pega el test
                 medio hecho (el `it` con el nombre del escenario y los
                 comentarios `// Dado`, `// Cuando`, `// Entonces` con alguna
                 línea de ejemplo) y diles que pidan el resto a Claude en su
                 terminal pasándole el escenario.
               - **Maqueta** (solo si la PR toca una web y la tarjeta tiene imagen):
                 compara la imagen con el JSX y el CSS y lista lo que falte de la
                 tarjeta (textos, columnas, campos, botones, colocación grande).
                 Ignora cabecera, pie, banners y lo que no es del MVP. Dilo como
                 sugerencia ("en la maqueta hay..."): puedes equivocarte. Nunca bloquea.
               - **Nombres**: si hay nombres vagos (`data`, `get`, `Props`...),
                 sugiere uno mejor. No bloquea.
               - **Siguiente paso**: una o dos frases con lo próximo que deben hacer.
               - Si toca la API o una web, añade al final: "Si Sonar falla por
                 cobertura, pide a Claude en tu terminal los tests de relleno de
                 esos ficheros, uno a uno."
            3. Responde con el veredicto (los criterios están en el apartado 6
               de docs/review-guide.md):
               - blocking = true si hay algún problema que impide fusionar:
                 un fallo, un escenario de la tarjeta sin hacer, datos de
                 entrada sin validar, un problema de seguridad (endpoint sin
                 guard, contraseña en la respuesta, datos del usuario en
                 localStorage, precio que llega del cliente...), una norma de
                 CLAUDE.md que no se cumple o una tarjeta sin ningún test.
               - blocking = false si solo hay sugerencias (nombres, otra forma
                 de hacerlo, tests de algún escenario si ya hay al menos uno,
                 diferencias con la maqueta, código o maqueta de una tarjeta
                 cercana, botones que aún no hacen nada, el tamaño de la PR).
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"}},"required":["blocking","summary"]}'

      - name: Gate (red if Claude found a blocking problem)
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          echo "$RESULT"
          BLOCKING=$(echo "$RESULT" | jq -r '.blocking' 2>/dev/null || echo "none")
          if [ "$BLOCKING" = "false" ]; then
            echo "Claude no ha encontrado nada que bloquee la PR."
          elif [ "$BLOCKING" = "true" ]; then
            echo "::error::Claude ha encontrado problemas que hay que arreglar. Mira sus comentarios en la PR."
            exit 1
          else
            # No verdict (Claude failed or ran out of turns): red, never green by mistake
            echo "::error::Claude no ha dado veredicto. Vuelve a lanzar el job (Re-run) o avisa al profesor."
            exit 1
          fi
