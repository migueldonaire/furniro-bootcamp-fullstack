# STAGING = always a copy of main.
# Every merged PR: build the API image, deploy API + shop + backoffice to staging,
# and run the security scan (OWASP ZAP) against staging.
# It is skipped until the variable DOCKERHUB_USERNAME exists (see docs/setup-guide.md).
name: staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: staging # one staging deploy at a time, in order

jobs:
  image:
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Version for staging (staging-<commit>)
        id: version
        run: echo "version=staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:sha-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:staging

  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ needs.image.outputs.version }}
      image-tag: sha-${{ github.sha }}
      ref: ${{ github.sha }}
    secrets: inherit

  # DAST: attacks the running web like a hacker would (only looks, does not break)
  zap:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: OWASP ZAP baseline against the shop
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.SHOP_URL }}
          allow_issue_writing: false
          fail_action: false
