# STAGING = always a copy of main.
# It waits for the CI of main: only when CI ends green on a commit of main, that
# commit goes to staging. If CI fails (or is cancelled), staging is not touched.
# Then: build the API image, deploy API + shop + backoffice to staging,
# and run the security scan (OWASP ZAP) against staging.
# It is skipped until the variable DOCKERHUB_USERNAME exists (see docs/setup-guide.md).
name: staging

on:
  workflow_run:
    workflows: [ci] # the "name:" of ci.yml
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency: staging # one staging deploy at a time, in order

env:
  SHA: ${{ github.event.workflow_run.head_sha }} # commit of main that passed CI

jobs:
  image:
    # only if CI was green and it was a push to main (not a PR)
    if: >-
      vars.DOCKERHUB_USERNAME != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }} # the commit that passed CI (not the latest one)
      - name: Version for staging (staging-<commit>)
        id: version
        run: echo "version=staging-${SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:sha-${{ env.SHA }}
            ${{ vars.DOCKERHUB_USERNAME }}/furniro-api:staging

  deploy:
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: ${{ needs.image.outputs.version }}
      image-tag: sha-${{ github.event.workflow_run.head_sha }}
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # DAST: attacks the running web like a hacker would (only looks, does not break)
  zap:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: OWASP ZAP baseline against the shop
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ vars.SHOP_URL }}
          allow_issue_writing: false
          fail_action: false
