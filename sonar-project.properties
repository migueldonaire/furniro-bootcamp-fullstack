# SonarQube Cloud (OSS plan): organization and project of Furniro.
sonar.organization=migueldonaire
sonar.projectKey=migueldonaire_furniro-bootcamp-fullstack

# One Sonar project for the whole monorepo
sonar.sources=api/src,shop/src,backoffice/src
sonar.tests=api/src,api/test,shop/src,backoffice/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,database/**

# Coverage reports (the CI downloads them into coverage/<name>/)
sonar.javascript.lcov.reportPaths=coverage/coverage-api/lcov.info,coverage/coverage-shop/lcov.info,coverage/coverage-backoffice/lcov.info

# Wait for the Quality Gate and fail if it does not pass
sonar.qualitygate.wait=true

# Test code. The new analysis scope of SonarQube Cloud ignores sonar.tests and
# sonar.test.inclusions, so the tests were counted as app code: "uncovered" and
# "duplicated" (shop and backoffice share helpers). They do not count for that.
sonar.coverage.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,**/src/test/**
sonar.cpd.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,**/src/test/**
